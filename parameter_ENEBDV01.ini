[Section19]
Key_name=One way bearing
Key_address=0108
Key_unit=digit
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Low nibble (0x000X) = drivetrain / stop strategy:\n0: no one-way bearing - bike speed from the motor Hall sensors\n1: one-way bearing - phase current to 0 on stop, motor coasts down\n2: one-way bearing - active -2.4A brake on stop (motor stops, wheel keeps turning)\n3: one-way bearing - PWM switched off at once on brake\n1-3: bike speed from the external wheel speed sensor\nbit4 (0x10): reverse Hall direction\nbit5 (0x20): reverse Iq direction\nbit4/bit5 are read only at power-up / parameter reload
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
