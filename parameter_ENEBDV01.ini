[Section33]
Key_name=Setting Parameter
Key_address=0200
Key_unit=digit
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=bit0 : console debug info (reserved, never implemented)\nbit1 : wheel circumference from   0 : driver (0x0201)   1 : console\nbit2 : speed limit from           0 : driver (0x0204)   1 : console\nbit3 : limit current from         0 : driver            1 : console\nRecommended 0x000E. Internal speed calculation always uses the flash wheel circumference (0x0201).\nNOT the same as the CAN line (CAN: bit1 = speed limit + wheel, bit2 = BMS battery info).\nbit4 was removed in v3.10 - do not reuse (old configs may still carry a 1).\nv2.55 re-mapped the bits: an old 0x0002 config becomes 0x0006, old bit2 (0x0004) moves to bit3 (0x0008).
Key_writeable=True
Key_hidden=True
Key_setbit=True
Key_production=False
