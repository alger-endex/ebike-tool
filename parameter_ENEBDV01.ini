[Section43]
Key_name=Hardware Parameter 1
Key_address=02A0
Key_unit=digit
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=bit0: Headlight (PA12)\nbit1: LightSW1 (PB4)\nbit2: LightSW2 (PB6)\nbit3: LightSW3 (PB7)\nbit4: BattaryLock (When used, LightSW2,LightSW3 will be ignored)\nbit5: Hublock\nbit6: cell phone 12V charger\nbit7 : Battary CAN (reserved on the UART line)\nbit8 : DIR as BRAKE\nbit9 : Derailleur signal (UART line only)\nbit10 : Headlight Switch 1: High/ 0: Low Side (production jig only)\nbit11 : RT as speed signal\nbit12 : Current By Calculation\nbit13 : PON Latch Disable\nbit14 : No motor temperature protection - 1 = ignore the motor NTC (v3.12+, was TO220_MOS). No effect on the UART line yet (motor over-temperature trip is not active)\nbit15 : Without HMI - runs without a display, assist index fixed at 8
Key_writeable=True
Key_hidden=True
Key_setbit=True
Key_production=False
[Section44]
Key_name=FW parameter
Key_address=02A1
Key_unit=xx
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=bit0: No Temperature Limit protect\nbit1: Reserved (IOT Mode on the CAN line, not implemented here)\nbit2: Bat Current Watt Limit - limits battery current with 0x0360 (0x0360 must not be 0)\nbit3: ENDEX Code enable - 1 = enabled. v3.12 flipped the polarity (was 0 = enabled); with bit3 clear the 25km/h clamp in its else branch does not run either\nbit4: Reserved (TORQ_IMM_MODE on the CAN line)\nbit5: Current ceiling enable - 1 = apply the cruise/throttle current ceiling, 0 = no ceiling at all (Is_max at any speed). v3.12 renamed it from Light load cap and widened its meaning: bit5=0 now allows MORE current at cruise than pre-v3.12 firmware\nbit6-15: not implemented on this line
Key_writeable=True
Key_hidden=False
Key_setbit=True
Key_production=False
