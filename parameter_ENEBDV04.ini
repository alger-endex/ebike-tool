Key_address=0201
Key_unit=mm
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Wheel circumference (same field as 0x0111). Used for every speed calculation.\nA display DRIVE_CFG write overwrites it and saves to flash.
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section33]
Key_name=Wheel Size
Key_address=0202
Key_unit=inch
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Wheel size. Stored only - not used by the Schaca firmware.
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section34]
Key_name=Motor Stuck rpm
Key_address=0203
Key_unit=0.1rpm
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Motor stuck detection (wheel-side rpm), 0 = disabled. In RUN with |Is| > 12 A and rpm below this for 5 s -> motor stop.\nBefore 2026-07-16 (EKIT v2.33 and older) this address was the bike gear ratio - old configs must not be reused here.\nApplied at power-up or reload (0x0555 = 2).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section35]
Key_name=Speed Limit
Key_address=0204
Key_unit=0.1Km/Hr
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Assist speed limit. Per level: x speed level % (0x0320-0x0328); +1.6 km/h hysteresis while running.\nAlso the zero-resistance speed authority. 0 = no assist.\nA display DRIVE_CFG write overwrites it (display value / 10) and saves to flash.
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
