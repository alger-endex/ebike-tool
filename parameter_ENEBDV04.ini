Key_setbit=False
Key_production=False
[Section41]
Key_name=Hardware Parameter 1
Key_address=02A0
Key_unit=digit
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=bit0: Headlight (PA12)\nbit1: LightSW1 (PB4)\nbit2: LightSW2 (PB6)\nbit3: LightSW3 (PB7)\nbit4: BattaryLock (When used, LightSW2,LightSW3 will be ignored)\nbit5: Hublock\nbit6: cell phone 12V charger\nbit7 : Battery CAN - 0 = no CAN battery: SOC estimated from voltage, controller sends battery info frames\nbit8 : DIR as BRAKE\nbit9 : E-Lock - 1 = start up in electronic-lock state (Schaca only; Derailleur signal on UART, unused on CAN)\nbit10 : Headlight Switch 1: High/ 0: Low Side\nbit11 : RT as speed signal (wheel pulses on the motor-temperature pin)\nbit12 : Current By Calculation\nbit13 : PON Latch Disable (no effect on ENEBDV04 - no Pon1 hold line)\nbit14 : Reserved (No motor temp protection on CAN/UART, not ported)\nbit15 : Without HMI - runs without a display; power-off is sent to the battery over CAN\nRead at power-up / reload (0x0555 = 2).
Key_writeable=True
Key_hidden=True
Key_setbit=True
Key_production=False
[Section42]
Key_name=FW parameter
Key_address=02A1
Key_unit=xx
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=bit0: No temperature current derating (MOS over-temperature trip stays active)\nbit1: IOT Mode - range estimate only on Schaca (0: ECO/EASY display modes change the estimate)\nbit2: Bat Current Watt Limit - assist power capped at 0x0360 x bus voltage (default 1)\nbit3: Reserved (ENDEX code on UART) - no effect on Schaca\nbit4: Reserved (TORQ_IMM_MODE on CAN) - no effect on Schaca\nbit5: Reserved (UART/CAN use) - no effect on Schaca\nbit6: Reserved (Bat_low_offPower on CAN) - no effect on Schaca\nbit7: Zero-resistance mode enable (Schaca only, default 1). Also needs torque sensor (0x0400 = 1-3), 0x0108 low nibble = 2, assist level 1-2. Tuning 0x0417-0x041A
Key_writeable=True
Key_hidden=False
Key_setbit=True
Key_production=False
