Key_address=0300
Key_unit=%
Key_upperbound=100
Key_lowerbound=0
Key_tooltip=Assist level 1 feel factor (%). Output-power target = the larger of\npedal power x (0.3 + 0.7 x this%) and pedal torque x (1.5 + 1.5 x this%), between 40 W and the power level cap.\nIt does not scale the current limits (0x0356-0x0358).\nThe first level set to 100 defines the number of assist levels; the display level is clamped to it.\nNot used at levels 1-2 while zero-resistance mode is active.
