[Section12]
Key_name=Rs
Key_address=0101
Key_unit=mohm
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Phase resistance.\nCurrent-loop Ki = 2*pi*Rs*BW (0x0121/0x0122).\nApplied at power-up or reload (0x0555 = 2).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section13]
Key_name=Ls
Key_address=0102
Key_unit=uH
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Phase inductance (reference).\nThe current-loop gains use Ld/Lq (0x0103/0x0104), not this value.
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section14]
Key_name=Ld
Key_address=0103
Key_unit=uH
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=d-axis inductance.\nId loop Kp = 2*pi*Ld*BW (0x0121).\nApplied at power-up or reload (0x0555 = 2).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section15]
Key_name=Lq
Key_address=0104
Key_unit=uH
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=q-axis inductance.\nIq loop Kp = 2*pi*Lq*BW (0x0122).\nApplied at power-up or reload (0x0555 = 2).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section16]
Key_name=Ke
Key_address=0105
Key_unit=10uVs
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Back-EMF constant, x0.00001 V.s/rad (electrical).\nPre-loads the Iq integrator when the motor starts while turning.\nApplied at power-up or reload (0x0555 = 2).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section17]
Key_name=Poles
Key_address=0106
Key_unit=
Key_upperbound=100
Key_lowerbound=0
Key_tooltip=Number of magnet poles (not pole pairs). Default 16.\n0 is treated as 2 poles for the rpm scaling.\nApplied at power-up or reload (0x0555 = 2).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section18]
Key_name=Motor Gear Ratio
Key_address=0107
Key_unit=0.001
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Motor internal gear ratio, x0.001 (11300 = 11.3). 0 is treated as 1:1.\nConverts Hall rpm to wheel rpm: bike speed when 0x0108 low nibble = 0, zero-resistance descent cut, rolling-start clutch take-up.\nApplied at power-up or reload (0x0555 = 2).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section19]
Key_name=One way bearing
Key_address=0108
Key_unit=digit
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Low nibble (0x000X) = drivetrain / stop strategy:\n0: no one-way bearing - bike speed from the motor Hall sensors (no wheel sensor needed)\n1: one-way bearing - on stop, phase current to 0 and the motor coasts down\n2: one-way bearing - on stop, active -2.4A brake (motor stops, wheel keeps turning). Required for zero-resistance mode\n3: PWM switched off at once on stop\n1-3: bike speed from the external wheel speed sensor\nbit4 (0x10): reverse Hall direction\nbit5 (0x20): reverse Iq direction\nbit4/bit5 are read only at power-up / reload (0x0555 = 2).\nDefault 0x22 (85TTS/85TS), 0x02 (Lexy W200Ba).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section20]
Key_name=Hall phase shift
Key_address=0109
Key_unit=0.1degree
Key_upperbound=3600
Key_lowerbound=0
Key_tooltip=
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section21]
Key_name=Max Voltage
Key_address=0112
Key_unit=0.1V
Key_upperbound=590
Key_lowerbound=0
Key_tooltip=Over-voltage protection threshold (fault after ~3 s above it). Firmware clamps to 590.\n>= 510 also selects the 54.6 V reference for the voltage-limited speed ceiling (else 42 V); > 520 selects the 48 V SOC table.\nLow-voltage power derating window = 0.64 -> 0.58 x this value (see 0x0372).\nApplied at power-up or reload (0x0555 = 2).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section22]
Key_name=Max Phase Current
Key_address=0113
Key_unit=0.01A
Key_upperbound=13200
Key_lowerbound=0
Key_tooltip=Phase over-current trip (not the assist limit 0x0357): any phase above this for >8 samples stops the motor;\nthe 4th trip since power-up latches the OVER_CURRENT fault. No firmware clamp on Schaca.\nApplied at power-up or reload (0x0555 = 2).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section23]
Key_name=Min Voltage
Key_address=0114
Key_unit=0.1V
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Under-voltage threshold: UNDER_VOLTAGE fault below this - 3.2 V, clears above this value.\nBattery without CAN: battery-empty flag below this + 0.5 V.\nApplied at power-up or reload (0x0555 = 2).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
