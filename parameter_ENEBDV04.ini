Key_name=Speed Ctrl Kp
Key_address=0115
Key_unit=0.0001
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Speed-limit PI loop Kp, x0.0001.\nApplied at power-up or reload (0x0555 = 2).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section25]
Key_name=Speed Ctrl Ki
Key_address=0116
Key_unit=0.0001
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Speed-limit PI loop Ki, x0.0001.\nApplied at power-up or reload (0x0555 = 2).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section26]
Key_name=Voltage utilization
Key_address=0117
Key_unit=%
Key_upperbound=100
Key_lowerbound=50
Key_tooltip=Voltage utilization: output voltage limit = bus V x this % x 0.577.\nFirmware clamps to 30-100. Default 97.
Key_writeable=True
Key_hidden=True
Key_setbit=False
Key_production=False
[Section27]
Key_name=Max motor speed
Key_address=0118
Key_unit=0.1Km/Hr
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Motor's real top speed at rated voltage. Speed ceiling = this x bus V / 54.6 V (0x0112 >= 510) or / 42 V.\nMust be >= 0x0204 or the top speed is capped. 0 = no normal assist (ceiling 0).\nAlso the zero-resistance coast wind-down rate reference (0 -> uses 0x0204).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section28]
Key_name=Spd sensor cnts
Key_address=0120
Key_unit=counts
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Wheel speed sensor pulses per wheel revolution. 0 is clamped to 1.\nUsed when bike speed comes from the wheel sensor (0x0108 low nibble 1-3).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section29]
Key_name=Current Control Id BW
Key_address=0121
Key_unit=Hz
Key_upperbound=2000
Key_lowerbound=0
Key_tooltip=d-axis current loop bandwidth, high-speed end. 0 or >2000 -> 500 Hz; below 50 Hz -> 50 Hz.\nScheduled from 50 Hz (<= 6 km/h) to this value (>= 15 km/h). Low-speed BW is fixed in firmware (no 0x0123 on Schaca).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section30]
Key_name=Current Control Iq BW
Key_address=0122
Key_unit=Hz
Key_upperbound=2000
Key_lowerbound=0
Key_tooltip=q-axis current loop bandwidth, high-speed end. 0 or >2000 -> 250 Hz; below 25 Hz -> 25 Hz.\nScheduled from 25 Hz (<= 6 km/h) to this value (>= 15 km/h). Low-speed BW is fixed in firmware (no 0x0124 on Schaca).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section31]
Key_name=Setting Parameter
Key_address=0200
Key_unit=digit
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=bit0 : console debug info - no effect on Schaca\nbit1 : speed limit and wheel circumference from console - no effect on Schaca\nbit2 : battery info from BMS - no effect on Schaca\nbit3 : limit current from console - no effect on Schaca\nStored only: the source selection exists only on the CAN/UART lines.\nA display DRIVE_CFG write always overwrites 0x0204 and 0x0201 and saves to flash.
Key_writeable=True
Key_hidden=True
Key_setbit=True
Key_production=False
