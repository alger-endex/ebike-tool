[Section72]
Key_name=Contorl mode
Key_address=0350
Key_unit=digit
Key_upperbound=255
Key_lowerbound=0
Key_tooltip=bit0 (0x01): torque sensor - square-law response (0 = linear)\nbit1 (0x02): start-up current limit (0x0356) NOT scaled by the assist level % (0 = scaled)\nbit2 (0x04): reserved (TOP_LV_FULL_CURRENT registered for the UART line, no effect on CAN)\nbit3 (0x08): full speed at every level - speed limit ignores Speed Level % (0x0320-); low-speed zone (0x0422) scaled by it instead\nbit4 (0x10): reserved (used by the UART line) - do not use\nuint8 - bits 8-15 are dropped. Not the same bit map as the UART line (UART bit1 = full current at the top level).
Key_writeable=True
Key_hidden=False
Key_setbit=True
Key_production=False
