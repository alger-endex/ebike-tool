[Section19]
Key_name=One way bearing
Key_address=0108
Key_unit=digit
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=Low nibble (0x000X) = drivetrain / stop strategy:\n0: no one-way bearing - bike speed from the motor Hall sensors\n1: one-way bearing - phase current to 0 on stop, motor coasts down\n2: one-way bearing - active -2.4A brake on stop above 32 rpm (motor stops, wheel keeps turning)\n3: one-way bearing - PWM switched off at once on brake\n1-3: bike speed from the external wheel speed sensor\nbit4 (0x10): reverse Hall direction\nbit5 (0x20): reverse Iq direction\nbit4/bit5 are read only at power-up / parameter reload
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section20]
Key_name=Hall phase shift
Key_address=0109
Key_unit=0.1degree
Key_upperbound=3600
Key_lowerbound=0
Key_tooltip=Hall sensor angle offset, 0.1 degree electrical (0-3600). Applied at power-up / parameter reload.
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section21]
Key_name=Max Voltage
Key_address=0112
Key_unit=0.1V
Key_upperbound=760
Key_lowerbound=0
Key_tooltip=Over-voltage protection threshold (fault while the bus stays above it).\nFirmware clamps to 760 on both ENEBDV02 and ENEBDV12.\nAlso selects the SOC voltage table (>520: 48V, >400: 36V, else 24V pack) and the 0x0118 voltage scaling (>=510: 54.6V, else 42V).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
[Section22]
Key_name=Max Phase Current
Key_address=0113
Key_unit=0.01A
Key_upperbound=13200
Key_lowerbound=0
Key_tooltip=Phase over-current trip level (not the assist limit 0x0357).\nA phase current above it for >1 ms stops the motor; after 3 such stops the next trip latches OVER_CURRENT.\nFirmware clamps to 7200 (ENEBDV02 500W) / 13200 (ENEBDV12 1kW).
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
