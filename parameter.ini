Key_unit=digit
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=0x00: Disable\n0x01: Enable - not scaled by the assist level % (assist level must still be >= 1)\n0x02: Enable with Level - current, power and speed scaled by the level % (0x0300 / 0x0310 / 0x0320)\n0x03: As Boost - not implemented on CAN (throttle has no effect)\n0x04: As Brake input IO - not implemented on CAN\n0x05: As Stand input IO - not implemented on CAN\n0x06: Enable No Error - as 0x01, a disconnected throttle is ignored without error (v3.04+)\nValues above 6 lock the throttle out.
