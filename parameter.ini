[Section33]
Key_name=Setting Parameter
Key_address=0200
Key_unit=digit
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=bit0 : console debug info (not used)\nbit1 : speed limit and wheel circum from   0 : driver   1 : console (not used)\nbit2 : console battery info from           0 : driver   1 : BMS (not used since v3.11)\nbit3 : limit current from                  0 : driver   1 : console (not used)\nNo bit has a consumer on the current CAN firmware: the KM CAN protocol that read them was removed in v3.11.\nA DRIVE_CFG_0 write from the Endex display always overwrites 0x0201/0x0204, whatever bit1 says.\nNOT the same bit map as the UART line.
