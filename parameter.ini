[Section86]
Key_name=Sensor Type
Key_address=0400
Key_unit=type
Key_upperbound=255
Key_lowerbound=0
Key_tooltip=0x00: cadence sensor only\n0x01: cadence + analog torque sensor (open/short -> torque sensor error, then cadence only until power cycle)\n0x02: cadence + UART tower-base sensor (TORG4BB) - not supported on the CAN line\n0x03: cadence + CAN tower-base sensor, LDS or TORG8B, auto-detected (v3.14+; no working source on v3.13). Wheel speed and cadence come from the sensor frames; 5 s without frames = torque sensor error\n0x0F: pedal sensor disable (throttle / walk assist only)
Key_writeable=True
Key_hidden=False
Key_setbit=False
Key_production=False
