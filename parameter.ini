[Section43]
Key_name=Hardware Parameter 1
Key_address=02A0
Key_unit=digit
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=bit0: Headlight (PA12)\nbit1: LightSW1 (PB4)\nbit2: LightSW2 (PB6)\nbit3: LightSW3 (PB7)\nbit4: BattaryLock - drives PB6/PB7, do not combine with LightSW2/LightSW3\nbit5: Hublock (CAN hub lock, HUB_ERROR when it does not answer)\nbit6: cell phone 12V charger (not used by the CAN firmware)\nbit7 : Battary CAN (no functional effect - BMS frames are always read)\nbit8 : DIR as BRAKE (Tdir low = brake, blocks motor start; Tdir is also the AB-phase cadence input)\nbit9 : Reserved\nbit10 : Headlight Switch 1: High/ 0: Low Side (not used by the CAN firmware)\nbit11 : RT as speed signal (wheel speed pulses read on the motor temperature wire)\nbit12 : Current By Calculation (rebuild one phase current at high modulation)\nbit13 : PON Latch Disable (power-hold output not latched once ready)\nbit14 : No motor temperature protection - 1 = ignore the motor NTC: no motor over-temperature fault, no motor derate (MOS protection unaffected). Default block = 1 since v3.13\nbit15 : Without HMI - motor may run with no display; on display timeout assist level is forced to 5 and there is no auto power-off
Key_writeable=True
Key_hidden=True
Key_setbit=True
Key_production=False
[Section44]
Key_name=FW parameter
Key_address=02A1
Key_unit=xx
Key_upperbound=65535
Key_lowerbound=0
Key_tooltip=bit0: No Temperature Limit protect - no MOS / motor current derate (over-temperature trips stay active)\nbit1: IOT Mode - 0: ECO/EASY display modes use a fixed power % in the range estimate. v3.13 also remapped the ECO/EASY assist level by speed; removed in v3.14+\nbit2: Bat Current Watt Limit - power limited to 0x0360 x battery voltage (keep 0x0360 non-zero)\nbit3: Reserved (used by UART line ENDEX_CODE, do not use)\nbit4: Torque imm mode - start/stop on pedal torque alone (start at 0x0415 from rest or 0x0414+1.0 while the cranks turn; stop below 0x0414 with no cadence)\nbit5: Current ceiling enable - 1: outside the launch range (wheel > 65 rpm, ~6 km/h) current capped at 80% (pedal) / 75% (throttle) of 0x0357, lifted to 100% by the low-speed heavy-load boost; 0: no ceiling (0x0357 at any speed). Was Light load cap before v3.13 - set 1 when upgrading v3.12 bikes\nbit6: Bat low off power - block motor start at extreme-low battery. Needs 0x0370 != 0: with battery comm when SOC = 0; without battery comm only with 0x0370 = 1 (SOC = 0 or bus < 0x0114 + 0.5V)\nOther bits (7-15): not used
Key_writeable=True
Key_hidden=False
Key_setbit=True
Key_production=False
